name: "Mallory"
description: >
  Independent adversarial testing on every pull request: a hostile agent attacks your running app,
  the committed regression tests re-check every bug you already fixed, and one comment reports it.
  No API key required.
author: "Mallory"
branding:
  icon: shield
  color: red

inputs:
  url:
    description: >
      URL of your app, already running on the runner (e.g. http://localhost:3000). Start it in an
      earlier step. Only loopback/private addresses are accepted; Mallory never tests a public host.
    required: true
  config:
    description: "Path to mallory.yaml (seeded test accounts). Optional."
    default: "mallory.yaml"
  tests:
    description: "Directory of committed regression tests (from `mallory adopt`)."
    default: "tests/mallory"
  baseline:
    description: "Known/accepted findings file (from `mallory baseline`). CI fails only on NEW findings."
    default: "mallory.baseline.json"
  fail-on:
    description: "Fail on NEW findings at or above this severity: critical | high | medium | low | none."
    default: "high"
  wait:
    description: "Seconds to wait for the app to become healthy."
    default: "60"
  comment:
    description: "Post/update a single pull request comment ('true' or 'false')."
    default: "true"
  browser:
    description: "Install Chromium so XSS checks can read the rendered DOM of client-rendered apps."
    default: "true"
  upload-report:
    description: "Upload the report and generated tests as a workflow artifact."
    default: "true"
  python-version:
    description: "Python version used to run Mallory."
    default: "3.12"
  github-token:
    description: "Token used to post the PR comment. Needs `pull-requests: write`."
    default: ${{ github.token }}

outputs:
  new-findings:
    description: "Number of findings not covered by the baseline."
    value: ${{ steps.mallory.outputs.new-findings }}
  regression-failures:
    description: "Number of committed regression tests that failed."
    value: ${{ steps.mallory.outputs.regression-failures }}
  failed:
    description: "'true' if the check failed."
    value: ${{ steps.mallory.outputs.failed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Mallory
      shell: bash
      env:
        MALLORY_SRC: ${{ github.action_path }}
      run: python -m pip install --quiet "$MALLORY_SRC"

    - name: Install browser
      if: inputs.browser == 'true'
      shell: bash
      run: python -m playwright install --with-deps chromium

    # Inputs reach the script only through env vars, never by interpolation into the script text,
    # so a hostile input value cannot inject shell commands.
    - name: Run Mallory
      id: mallory
      shell: bash
      env:
        MALLORY_URL: ${{ inputs.url }}
        MALLORY_CONFIG: ${{ inputs.config }}
        MALLORY_TESTS: ${{ inputs.tests }}
        MALLORY_BASELINE: ${{ inputs.baseline }}
        MALLORY_FAIL_ON: ${{ inputs.fail-on }}
        MALLORY_WAIT: ${{ inputs.wait }}
        MALLORY_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(ci --url "$MALLORY_URL" --config "$MALLORY_CONFIG" --tests "$MALLORY_TESTS" \
              --baseline "$MALLORY_BASELINE" --fail-on "$MALLORY_FAIL_ON" --wait "$MALLORY_WAIT")
        if [ "$MALLORY_COMMENT" != "true" ]; then args+=(--no-comment); fi
        mallory "${args[@]}"

    - name: Upload Mallory report
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: mallory-report
        path: |
          .mallory/report.md
          .mallory/comment.md
          .mallory/verification.json
          .mallory/tests
        if-no-files-found: ignore
