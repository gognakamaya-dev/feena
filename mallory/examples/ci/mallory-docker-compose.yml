# Drop into .github/workflows/mallory.yml. Your app is started by a normal step; Mallory attaches
# to it on the runner. No API key, no secrets.
name: Mallory
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write     # lets Mallory update its single PR comment

jobs:
  mallory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the app (test database, seeded test accounts)
        run: docker compose up -d --build --wait   # --wait blocks on the service healthcheck

      - uses: OWNER/mallory@v0            # replace OWNER; or `uses: ./` if vendored in your repo
        with:
          url: http://localhost:3000
          fail-on: high                    # fail the PR on NEW findings at or above this
          # tests: tests/mallory           # committed regression tests (see `mallory adopt`)
          # baseline: mallory.baseline.json
