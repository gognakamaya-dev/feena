# Feena benchmark targets.
#
# READ FIRST. Every target here is CLONED or PULLED and run LOCALLY inside a Feena sandbox
# (a throwaway, no-egress container). This file must never point at a hosted instance you do not
# own. Testing a live third-party service without permission is unauthorised scanning — don't.
#
# The default set is intentionally-vulnerable apps published expressly for security testing, so
# they have documented ground-truth bugs and are safe and legal to run locally. Add your own
# apps only if you own them or are authorised to test them.
#
# kinds:
#   process : import a local WSGI app, serve in-thread (bundled examples only; no Docker needed)
#   image   : pull a prebuilt image and sandbox it (needs Docker)
#   repo    : git-clone and build from the repo's Dockerfile/compose in the sandbox (needs Docker)

targets:
  # --- bundled examples: run end-to-end with no Docker, prove the harness works ---
  - name: taskflow-example
    kind: process
    module: examples/taskflow/app.py:app
    port: 0
    healthcheck: /api/health
    users:
      - {label: alice, email: alice@example.com, password: password123}
      - {label: bob,   email: bob@example.com,   password: password123}
    notes: our realistic vibe-coded SaaS; ground truth in examples/taskflow/GROUND_TRUTH.md

  - name: vuln-shop-example
    kind: process
    module: examples/vuln-shop/app.py:app
    port: 0
    healthcheck: /api/health
    users:
      - {label: alice, email: alice@example.com, password: password123}
      - {label: bob,   email: bob@example.com,   password: password123}
    notes: the original planted-bug demo app

  - name: spa-notes-example
    kind: process
    module: examples/spa-notes/app.py:app
    port: 0
    healthcheck: /api/health
    notes: client-rendered SPA; its XSS is only visible in the rendered DOM (browser path)

  # --- OWASP benchmarks: published for security testing, documented vulnerabilities ---
  - name: owasp-juice-shop
    kind: image
    image: bkimminich/juice-shop:latest
    port: 3000
    healthcheck: /rest/admin/application-version
    users:
      - {label: attacker, email: attacker@juice.test, password: feenatest1}
      - {label: victim,   email: victim@juice.test,   password: feenatest2}
    notes: OWASP Juice Shop — the standard modern vulnerable app (broad OWASP Top 10 coverage)

  - name: owasp-nodegoat
    kind: repo
    repo: https://github.com/OWASP/NodeGoat.git
    ref: master
    port: 4000
    healthcheck: /
    users:
      - {label: attacker, email: attacker@nodegoat.test, password: feenatest1}
      - {label: victim,   email: victim@nodegoat.test,   password: feenatest2}
    notes: OWASP NodeGoat — Node/Express app demonstrating the OWASP Top 10

  - name: dvwa
    kind: image
    image: vulnerables/web-dvwa:latest
    port: 80
    healthcheck: /login.php
    notes: Damn Vulnerable Web App — classic PHP training target

  # --- your own self-hosted open-source apps go below (own-or-authorised only) ---
