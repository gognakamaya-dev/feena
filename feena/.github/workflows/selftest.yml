# Dogfood: run the local action against the FIXED demo app. Expect a green check.
name: Selftest
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the fixed demo app
        run: |
          pip install flask
          cd examples/taskflow-fixed
          TASKFLOW_DB=/tmp/taskflow.db python -c "import app; app.init_db(); app.app.run(port=5000)" &
      - uses: ./
        with:
          url: http://127.0.0.1:5000
          config: examples/taskflow/feena.yaml
          tests: examples/taskflow/generated-tests
          upload-report: "false"
