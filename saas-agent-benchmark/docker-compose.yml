# Generated by scripts/generate.py. Images contain only common/ and apps/ (no tests, no benchmark/ manifests).
services:
  invoiceflow:
    build: .
    command: python -m common.run invoiceflow --host 0.0.0.0 --port 9101
    ports: ["9101:9101"]
    environment: [BENCH_KEY=${BENCH_KEY:-benchmark-local}, BENCH_DATA_DIR=/data]
    volumes: ["invoiceflow-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9101/health')"], interval: 5s, retries: 10}
